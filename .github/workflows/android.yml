name: Build Android app

# Produces a signed APK and attaches it to a GitHub Release you can
# download straight onto the phone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Derive the version code
        # app.json's version is the source of truth, set by hand, so
        # releases are named deliberately. versionCode -- the integer
        # Android compares to decide whether an APK is an update -- is
        # derived from it so the two can never drift apart.
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const v = String(cfg.expo.version);
            const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(v);
            if (!m) { console.error('app.json version must be x.y.z, got ' + v); process.exit(1); }
            const code = Number(m[1]) * 10000 + Number(m[2]) * 100 + Number(m[3]);
            cfg.expo.android.versionCode = code;
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'APP_VERSION=' + v + '\n');
            console.log('version ' + v + '  versionCode ' + code);
          "

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        run: |
          # React Native ships native code for four processor types by
          # default and the APK carries all of them, though a phone uses
          # exactly one. Every Android phone made since roughly 2017 is
          # arm64.
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          grep '^reactNativeArchitectures' android/gradle.properties

          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Gradle signs release builds with a throwaway debug key by
          # default. Replace that signature with the real one so every
          # build installs as an update over the last.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          echo "Using build-tools $BUILD_TOOLS"

          UNSIGNED=android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out dist/courier.apk \
            "$UNSIGNED"

          # Fail loudly rather than shipping something the phone will reject.
          "$APKSIGNER" verify --print-certs dist/courier.apk

          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: courier-apk
          path: app/dist/courier.apk
          retention-days: 90

      - name: Publish a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APP_VERSION}"
          APK=app/dist/courier.apk
          SIZE=$(( $(stat -c%s "$APK") / 1048576 ))
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)

          {
            echo "Android APK built from \`${GITHUB_SHA::7}\`."
            echo
            echo "Download **courier.apk** below and open it on your phone to install."
            echo "It installs over any earlier version and keeps your paired PC."
            echo
            echo "- Size: ${SIZE} MB"
            echo "- Needs a 64-bit ARM phone (anything from roughly 2017 onwards)"
            echo "- SHA-256: \`${SUM}\`"
          } > notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - replacing its APK."
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Courier $TAG" \
              --notes-file notes.md \
              --latest
          fi
        working-directory: .
